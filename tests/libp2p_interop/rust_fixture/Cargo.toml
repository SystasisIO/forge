[package]
name = "forge-libp2p-rust-fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"

[[bin]]
name = "forge-libp2p-rust-fixture"
path = "main.rs"

[dependencies]
futures = "0.3"
hickory-resolver = { version = "=0.25.2", default-features = false }
libp2p = { path = "../fixture-deps/rust-libp2p/libp2p", features = ["tokio", "tcp", "dns", "noise", "tls", "yamux", "quic", "ping", "identify", "autonat", "relay", "dcutr", "kad", "rendezvous", "gossipsub", "pnet", "macros"] }
libp2p-stream = { path = "../fixture-deps/rust-libp2p/protocols/stream" }
quick-protobuf = "=0.8.1"
rand = "0.8.5"
serde_json = "1"
sha2 = "=0.10.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
