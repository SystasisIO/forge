name: VM WASM

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/vm-wasm.yml
      - .github/scripts/check-vm-wasm-test-registry.py
      - .github/scripts/check-llvm-cxx-abi.py
      - .github/scripts/check-vm-wasm-toolchain.py
      - .github/scripts/setup-vm-wasm-toolchain.sh
      - .github/probes/llvm-cxx-abi/**
      - .github/scripts/install-glaze.sh
      - .clang-format
      - .gitmodules
      - CMakeLists.txt
      - cmake/ForgeConfig.cmake.in
      - cmake/ForgeSoftFloatAbi.cmake
      - cmake/ForgeVendorCompilePolicy.cmake
      - cmake/ForgeWamr*.cmake
      - cmake/patches/wamr-*.patch
      - libraries/vm/CMakeLists.txt
      - libraries/vm/wasm/**
      - libraries/tooling/wasm_compiler/**
      - tools/CMakeLists.txt
      - tools/wasm-compiler/**
      - tests/CMakeLists.txt
      - tests/vm_wasm/**
      - tests/vm_wasm_execution/**
      - tests/vm_wasm_optimizing/**
      - tests/vm_wamr/**
      - tests/package_vm_wasm_interpret_component/**
      - tests/package_vm_wasm_execution_component/**
      - tests/package_vm_wasm_optimizing_component/**
      - vendor/wamr
      - vendor/softfloat
      - vendor/eos-vm-test-wasms
  workflow_dispatch:
    inputs:
      qualify_compiler_aot:
        description: Run compiler/AOT checks in LLVM 22.1.8 JIT lanes (automatic on PR)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  DONOR_COMMIT: e5b1fc79c4b8d78f32749afa94a8d4c4d071f67f
  FIXTURE_COMMIT: ffbbb552e6020623d8ae148d81a152c8ef700325
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  VM_RUNTIME_TEST_TARGETS: >-
    test_forge_vm_wasm_interpret_unit
    test_forge_vm_wasm_interpret_internal
    test_forge_vm_wasm_interpret_spec
    forge_vm_wasm_interpret_spec_test_generator
    test_forge_vm_wasm_prepared_validation
    test_forge_vm_wasm_numeric
    test_forge_vm_wasm_invocation
    test_forge_vm_wasm_context_exit_fp
    test_forge_vm_wasm_context_exit_allocation_failure
    test_forge_vm_wasm_execution
    test_forge_vm_wasm_engine_memory
    test_forge_vm_wasm_consumer_api
    test_forge_vm_wasm_timing_allocation
    test_forge_vm_wasm_allocator_allocation
    test_forge_vm_wasm_preparation_budget
    test_forge_vm_wasm_profile_public
    test_forge_wamr_fp_status
    test_forge_wamr_jit_load
    test_forge_wamr_load_args

jobs:
  style:
    name: ubuntu-26.04 / clang-format 22
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format 22
        run: sudo apt-get update && sudo apt-get install -y clang-format-22

      - name: Check Forge-owned VM sources
        shell: bash
        run: |
          find libraries/vm/wasm/interpret -type f \
            \( -name '*.cppm' -o -name '*.cpp' -o -name '*.hpp' \) \
            -print0 | xargs -0 clang-format-22 --dry-run --Werror
          printf '%s\0' \
            tests/vm_wasm/main.cpp \
            tests/vm_wasm/port_regression_tests.cpp \
            tests/vm_wasm/watchdog_regression_tests.cpp \
            tests/vm_wasm/test_prelude.hpp \
            tests/vm_wasm/test_support.hpp \
            tests/vm_wasm/fuzz_driver.cpp \
            tests/vm_wasm/context_exit_tests.cpp \
            tests/vm_wasm/context_exit_fp_faults.cpp \
            tests/vm_wasm/context_exit_allocation_failure_probe.cpp \
            tests/package_vm_wasm_interpret_component/main.cpp \
            .github/probes/llvm-cxx-abi/main.cpp \
            | xargs -0 clang-format-22 --dry-run --Werror

  native:
    name: ${{ matrix.os }} / ${{ matrix.build_type }} / WAMR interpreter
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15-intel]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install exact22.1.8 VM toolchain without source fallback
        timeout-minutes: 20
        run: bash .github/scripts/setup-vm-wasm-toolchain.sh build/vm-wasm/toolchain

      - name: Require live libc++220108 headers before Forge configure
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/check-vm-wasm-toolchain.py headers build/vm-wasm/toolchain \
            2>&1 | tee build/vm-wasm/toolchain/header-preflight.log

      - name: Install toolchain and dependencies
        shell: bash
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          fi
          brew install boost cmake gmp libngtcp2 ninja openssl@3
          echo "OPENSSL_PREFIX=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          "$GITHUB_WORKSPACE/.github/scripts/install-glaze.sh" "$RUNNER_TEMP/forge-glaze"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/forge-glaze;$(brew --prefix);$(brew --prefix boost);$(brew --prefix libngtcp2);$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Check out pinned donor for the mapping gate
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/AntelopeIO/eos-vm.git build/eos-vm-donor
          git -C build/eos-vm-donor checkout "$DONOR_COMMIT"

      - name: Configure
        shell: bash
        run: |
          openssl_suffix=so.3
          args=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            openssl_suffix=3.dylib
            args+=("-DCMAKE_OSX_SYSROOT=$SDKROOT")
          fi
          cmake -S . -B build/vm-wasm -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_PREFIX" \
            -DOPENSSL_INCLUDE_DIR="$OPENSSL_PREFIX/include" \
            -DOPENSSL_SSL_LIBRARY="$OPENSSL_PREFIX/lib/libssl.$openssl_suffix" \
            -DOPENSSL_CRYPTO_LIBRARY="$OPENSSL_PREFIX/lib/libcrypto.$openssl_suffix" \
            -DFORGE_ENABLE_MODULES=ON \
            -DFORGE_ENABLE_ROCKSDB=OFF \
            -DFORGE_ENABLE_TUI=OFF \
            -DFORGE_ENABLE_TOOLING=OFF \
            -DFORGE_ENABLE_VM_WASM_LLVM_JIT=OFF \
            -DFORGE_ENABLE_VM_WASM_OPTIMIZING=OFF \
            -DFORGE_ENABLE_WASM_COMPILER=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_LLVM=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Clang=ON \
            -DFORGE_VM_WASM_INTERPRET_TEST_INTERPRETER_ONLY=ON \
            -DFORGE_VM_WASM_INTERPRET_DONOR_ROOT="$GITHUB_WORKSPACE/build/eos-vm-donor" \
            -DBUILD_TESTING=ON "${args[@]}"

      - name: Build native VM tests
        shell: bash
        run: |
          read -r -a targets <<< "$VM_RUNTIME_TEST_TARGETS"
          cmake --build build/vm-wasm --target "${targets[@]}" -j 2

      - name: Verify every selected test and helper is built
        shell: bash
        run: |
          ctest --test-dir build/vm-wasm \
            -L '^(vm_wasm_interpret|vm_wasm_execution)$' \
            --show-only=json-v1 > build/vm-wasm/runtime-registry.json
          python3 .github/scripts/check-vm-wasm-test-registry.py \
            build/vm-wasm/runtime-registry.json --jit OFF --aot OFF

      - name: Run LLVM-free WAMR runtime suite
        run: >-
          ctest --test-dir build/vm-wasm
          -L '^(vm_wasm_interpret|vm_wasm_execution)$'
          --output-on-failure --no-tests=error -j 1
          --output-log "$GITHUB_WORKSPACE/build/vm-wasm/runtime-ctest.log"
          --output-junit "$GITHUB_WORKSPACE/build/vm-wasm/runtime-ctest.xml"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wamr-runtime-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            build/vm-wasm/runtime-ctest.*
            build/vm-wasm/runtime-registry.json
            build/vm-wasm/Testing/Temporary/LastTest.log
            build/vm-wasm/CMakeFiles/CMakeConfigureLog.yaml
            build/vm-wasm/toolchain/*
            build/vm-wasm/tests/vm_wasm_execution/fp_status/*.linkmap

  # Linux must qualify the official package's actual C++ ABI before any Forge build.
  llvm-wamr:
    name: ${{ matrix.os }} / ${{ matrix.arch }} / WAMR ${{ matrix.backend }} / compiler-AOT=${{ (github.event_name == 'pull_request' || inputs.qualify_compiler_aot) && matrix.backend == 'jit' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, arch: arm64, backend: interpreter}
          - {os: macos-15, arch: arm64, backend: jit}
          - {os: ubuntu-24.04, arch: x86_64, backend: jit}
    env:
      WAMR_JIT: ${{ matrix.backend == 'jit' && 'ON' || 'OFF' }}
      WAMR_AOT: ${{ (github.event_name == 'pull_request' || inputs.qualify_compiler_aot) && matrix.backend == 'jit' && 'ON' || 'OFF' }}
      WAMR_INTERPRETER_ONLY: ${{ matrix.backend == 'interpreter' && 'ON' || 'OFF' }}
      WAMR_BUILD_DIR: build/vm-wasm-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Qualify the official Linux X64 LLVM archive (mandatory on x86)
        if: runner.os == 'Linux'
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "HARNESS_ERROR: official LLVM Linux X64 bootstrap/preflight failed" >&2' ERR
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 binutils xz-utils \
            zlib1g-dev libzstd-dev libxml2-dev libedit-dev libffi-dev libtinfo6
          archive="$RUNNER_TEMP/LLVM-22.1.8-Linux-X64.tar.xz"
          curl --fail --location --retry 3 --max-time 900 \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-Linux-X64.tar.xz \
            --output "$archive"
          echo "df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384  $archive" | sha256sum --check --strict
          mkdir -p "$WAMR_BUILD_DIR"
          tar -tJf "$archive" > "$WAMR_BUILD_DIR/llvm-archive-files.txt"
          llvm_prefix="$RUNNER_TEMP/forge-official-llvm-22.1.8"
          mkdir "$llvm_prefix"
          tar -xJf "$archive" --strip-components=1 -C "$llvm_prefix"
          python3 .github/scripts/check-llvm-cxx-abi.py "$llvm_prefix" \
            "$WAMR_BUILD_DIR/llvm-abi-preflight" 2>&1 | tee "$WAMR_BUILD_DIR/llvm-abi-preflight.log"

      - name: Install qualified ARM22.1.8 bottle without source fallback
        if: runner.os == 'macOS'
        timeout-minutes: 20
        run: bash .github/scripts/setup-vm-wasm-toolchain.sh "$WAMR_BUILD_DIR/toolchain"

      - name: Require live libc++220108 headers before Forge configure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WAMR_BUILD_DIR/toolchain"
          python3 .github/scripts/check-vm-wasm-toolchain.py headers "$WAMR_BUILD_DIR/toolchain" \
            2>&1 | tee "$WAMR_BUILD_DIR/toolchain/header-preflight.log"

      - name: Install toolchain and dependencies
        shell: bash
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          if ! command -v brew >/dev/null 2>&1; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          fi
          brew install boost cmake gmp libngtcp2 ninja openssl@3
          echo "OPENSSL_PREFIX=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          "$GITHUB_WORKSPACE/.github/scripts/install-glaze.sh" "$RUNNER_TEMP/forge-glaze"
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/forge-glaze;$(brew --prefix);$(brew --prefix boost);$(brew --prefix libngtcp2);$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Require the qualified LLVM package for JIT and compiler
        shell: bash
        run: |
          if [[ "$WAMR_JIT" == "ON" ]]; then
            test "$("$LLVM_PREFIX/bin/llvm-config" --version)" = "22.1.8"
            test "$("$LLVM_PREFIX/bin/llvm-config" --has-rtti)" = "YES"
          fi

      - name: Configure explicit WAMR backend
        shell: bash
        run: |
          args=()
          if [[ "$WAMR_JIT" == "ON" ]]; then
            args+=("-DLLVM_DIR=$LLVM_PREFIX/lib/cmake/llvm" "-DClang_DIR=$LLVM_PREFIX/lib/cmake/clang")
          else
            args+=(-DCMAKE_DISABLE_FIND_PACKAGE_LLVM=ON)
          fi
          openssl_suffix=so.3
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            openssl_suffix=3.dylib
            args+=("-DCMAKE_OSX_SYSROOT=$(xcrun --show-sdk-path)")
          fi
          if [[ "$WAMR_AOT" == "ON" ]]; then
            # Explicit finite diagnostic process allowance, not a production default.
            args+=(-DFORGE_WAMR_COMPILER_TEST_AS_BYTES=1099511627776)
          fi
          cmake -S . -B "$WAMR_BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_PREFIX" \
            -DOPENSSL_INCLUDE_DIR="$OPENSSL_PREFIX/include" \
            -DOPENSSL_SSL_LIBRARY="$OPENSSL_PREFIX/lib/libssl.$openssl_suffix" \
            -DOPENSSL_CRYPTO_LIBRARY="$OPENSSL_PREFIX/lib/libcrypto.$openssl_suffix" \
            -DFORGE_ENABLE_MODULES=ON \
            -DFORGE_ENABLE_ROCKSDB=OFF \
            -DFORGE_ENABLE_TUI=OFF \
            -DFORGE_ENABLE_TOOLING=OFF \
            -DFORGE_ENABLE_VM_WASM_LLVM_JIT="$WAMR_JIT" \
            -DFORGE_ENABLE_VM_WASM_OPTIMIZING="$WAMR_AOT" \
            -DFORGE_ENABLE_WASM_COMPILER="$WAMR_AOT" \
            -DCMAKE_DISABLE_FIND_PACKAGE_Clang=ON \
            -DFORGE_VM_WASM_INTERPRET_TEST_INTERPRETER_ONLY="$WAMR_INTERPRETER_ONLY" \
            -DBUILD_TESTING=ON "${args[@]}"

      - name: Build all selected runtime and compiler tests
        shell: bash
        run: |
          read -r -a targets <<< "$VM_RUNTIME_TEST_TARGETS"
          if [[ "$WAMR_JIT" == "ON" ]]; then
            targets+=(test_forge_wamr_jit_native_maps test_forge_wamr_jit_error_threads)
          fi
          if [[ "$WAMR_AOT" == "ON" ]]; then
            targets+=(test_forge_vm_wasm_optimizing test_forge_vm_wasm_optimizing_traps
              test_forge_vm_wasm_optimizing_preparation test_forge_vm_wasm_optimizing_session
              test_forge_vm_wasm_optimizing_session_probe test_forge_vm_wasm_optimizing_cleanup)
            targets+=(wamr_export_name_fixture test_forge_vm_wasm_optimizing_export_names)
            targets+=(wamr_optimizing_fixtures wasm_compiler)
            # The optimizing label also selects the real installed package test.
            targets+=(test_forge_package_install)
          fi
          cmake --build "$WAMR_BUILD_DIR" --target "${targets[@]}" -j 2

      - name: Verify every selected test and helper is built
        shell: bash
        run: |
          ctest --test-dir "$WAMR_BUILD_DIR" \
            -L '^(vm_wasm_interpret|vm_wasm_execution|optimizing)$' \
            --show-only=json-v1 > "$WAMR_BUILD_DIR/runtime-registry.json"
          python3 .github/scripts/check-vm-wasm-test-registry.py \
            "$WAMR_BUILD_DIR/runtime-registry.json" --jit "$WAMR_JIT" --aot "$WAMR_AOT"

      - name: Run the complete selected WAMR matrix
        run: >-
          ctest --test-dir "$WAMR_BUILD_DIR"
          -L '^(vm_wasm_interpret|vm_wasm_execution|optimizing)$'
          --output-on-failure --no-tests=error -j 1
          --output-log "$GITHUB_WORKSPACE/$WAMR_BUILD_DIR/runtime-ctest.log"
          --output-junit "$GITHUB_WORKSPACE/$WAMR_BUILD_DIR/runtime-ctest.xml"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wamr-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.backend }}-compiler-aot-${{ env.WAMR_AOT }}
          path: |
            ${{ env.WAMR_BUILD_DIR }}/llvm-archive-files.txt
            ${{ env.WAMR_BUILD_DIR }}/toolchain/*
            ${{ env.WAMR_BUILD_DIR }}/llvm-abi-preflight.log
            ${{ env.WAMR_BUILD_DIR }}/llvm-abi-preflight/*.txt
            ${{ env.WAMR_BUILD_DIR }}/llvm-abi-preflight/*.json
            ${{ env.WAMR_BUILD_DIR }}/llvm-abi-preflight/build/*.txt
            ${{ env.WAMR_BUILD_DIR }}/llvm-abi-preflight/build/*.linkmap
            ${{ env.WAMR_BUILD_DIR }}/llvm-abi-preflight/build/CMakeFiles/CMakeConfigureLog.yaml
            ${{ env.WAMR_BUILD_DIR }}/runtime-ctest.*
            ${{ env.WAMR_BUILD_DIR }}/runtime-registry.json
            ${{ env.WAMR_BUILD_DIR }}/Testing/Temporary/LastTest.log
            ${{ env.WAMR_BUILD_DIR }}/CMakeFiles/CMakeConfigureLog.yaml
            ${{ env.WAMR_BUILD_DIR }}/tests/vm_wasm_execution/*.linkmap
            ${{ env.WAMR_BUILD_DIR }}/tests/vm_wasm_execution/fp_status/*.linkmap
            ${{ env.WAMR_BUILD_DIR }}/tools/wasm-compiler/*.linkmap
            ${{ env.WAMR_BUILD_DIR }}/tests/vm_wasm_optimizing/*.linkmap
            ${{ env.WAMR_BUILD_DIR }}/forge-package-vm-wasm-optimizing-component/package-tests.*
            ${{ env.WAMR_BUILD_DIR }}/forge-package-vm-wasm-optimizing-component/*.linkmap

  sanitizer:
    name: ubuntu-26.04 / interpreter / ASan+UBSan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install exact22.1.8 VM toolchain without source fallback
        timeout-minutes: 20
        run: bash .github/scripts/setup-vm-wasm-toolchain.sh build/vm-wasm-sanitizer/toolchain

      - name: Require live libc++220108 headers before Forge configure
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/check-vm-wasm-toolchain.py headers build/vm-wasm-sanitizer/toolchain \
            2>&1 | tee build/vm-wasm-sanitizer/toolchain/header-preflight.log

      - name: Install toolchain and dependencies
        shell: bash
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          fi
          brew install boost cmake gmp libngtcp2 ninja openssl@3
          echo "OPENSSL_PREFIX=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          "$GITHUB_WORKSPACE/.github/scripts/install-glaze.sh" "$RUNNER_TEMP/forge-glaze"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/forge-glaze;$(brew --prefix);$(brew --prefix boost);$(brew --prefix libngtcp2);$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Configure sanitizer build
        shell: bash
        run: |
          sanitizer_flags="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake -S . -B build/vm-wasm-sanitizer -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_PREFIX" \
            -DOPENSSL_INCLUDE_DIR="$OPENSSL_PREFIX/include" \
            -DOPENSSL_SSL_LIBRARY="$OPENSSL_PREFIX/lib/libssl.so.3" \
            -DOPENSSL_CRYPTO_LIBRARY="$OPENSSL_PREFIX/lib/libcrypto.so.3" \
            -DCMAKE_C_FLAGS="$sanitizer_flags" \
            -DCMAKE_CXX_FLAGS="$sanitizer_flags $CXXFLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$sanitizer_flags $LDFLAGS" \
            -DFORGE_ENABLE_MODULES=ON \
            -DFORGE_ENABLE_ROCKSDB=OFF \
            -DFORGE_ENABLE_TUI=OFF \
            -DFORGE_ENABLE_TOOLING=OFF \
            -DFORGE_ENABLE_VM_WASM_LLVM_JIT=OFF \
            -DFORGE_ENABLE_VM_WASM_OPTIMIZING=OFF \
            -DFORGE_ENABLE_WASM_COMPILER=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_LLVM=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Clang=ON \
            -DFORGE_VM_WASM_INTERPRET_TEST_INTERPRETER_ONLY=ON \
            -DBUILD_TESTING=ON

      - name: Build sanitizer tests
        run: >-
          cmake --build build/vm-wasm-sanitizer --target
          test_forge_vm_wasm_interpret_unit
          test_forge_vm_wasm_interpret_internal
          test_forge_vm_wasm_interpret_spec
          -j 4

      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >-
          ctest --test-dir build/vm-wasm-sanitizer
          -R '^test_forge_vm_wasm_interpret_(unit|internal|spec)$'
          --output-on-failure --no-tests=error -j 1
          --output-log "$GITHUB_WORKSPACE/build/vm-wasm-sanitizer/sanitizer-ctest.log"
          --output-junit "$GITHUB_WORKSPACE/build/vm-wasm-sanitizer/sanitizer-ctest.xml"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wamr-interpreter-sanitizer
          path: |
            build/vm-wasm-sanitizer/sanitizer-ctest.*
            build/vm-wasm-sanitizer/Testing/Temporary/LastTest.log
            build/vm-wasm-sanitizer/CMakeFiles/CMakeConfigureLog.yaml
            build/vm-wasm-sanitizer/toolchain/*

  package:
    name: ubuntu-26.04 / relocatable package
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install exact22.1.8 VM toolchain without source fallback
        timeout-minutes: 20
        run: bash .github/scripts/setup-vm-wasm-toolchain.sh build/vm-wasm-package/toolchain

      - name: Require live libc++220108 headers before Forge configure
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/check-vm-wasm-toolchain.py headers build/vm-wasm-package/toolchain \
            2>&1 | tee build/vm-wasm-package/toolchain/header-preflight.log

      - name: Install toolchain and dependencies
        shell: bash
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          fi
          brew install boost cmake gmp libngtcp2 ninja openssl@3
          echo "OPENSSL_PREFIX=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          "$GITHUB_WORKSPACE/.github/scripts/install-glaze.sh" "$RUNNER_TEMP/forge-glaze"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/forge-glaze;$(brew --prefix);$(brew --prefix boost);$(brew --prefix libngtcp2);$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Configure package build
        shell: bash
        run: |
          cmake -S . -B build/vm-wasm-package -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_PREFIX" \
            -DOPENSSL_INCLUDE_DIR="$OPENSSL_PREFIX/include" \
            -DOPENSSL_SSL_LIBRARY="$OPENSSL_PREFIX/lib/libssl.so.3" \
            -DOPENSSL_CRYPTO_LIBRARY="$OPENSSL_PREFIX/lib/libcrypto.so.3" \
            -DFORGE_ENABLE_MODULES=ON \
            -DFORGE_ENABLE_ROCKSDB=OFF \
            -DFORGE_ENABLE_TUI=OFF \
            -DFORGE_ENABLE_TOOLING=OFF \
            -DFORGE_ENABLE_VM_WASM_LLVM_JIT=OFF \
            -DFORGE_ENABLE_VM_WASM_OPTIMIZING=OFF \
            -DFORGE_ENABLE_WASM_COMPILER=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_LLVM=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Clang=ON \
            -DBUILD_TESTING=ON

      - name: Build installed package consumer
        run: cmake --build build/vm-wasm-package --target test_forge_package_vm_wasm_interpret_component -j 4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wamr-package-toolchain
          path: build/vm-wasm-package/toolchain/*

  donor-oracle:
    name: ubuntu-24.04 / original Catch2 bodies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install donor build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Check out pinned donor and fixture corpus
        shell: bash
        run: |
          git clone https://github.com/AntelopeIO/eos-vm.git build/eos-vm-oracle
          git -C build/eos-vm-oracle checkout "$DONOR_COMMIT"
          git -C build/eos-vm-oracle submodule update --init --recursive
          git clone https://github.com/EOSIO/eos-vm-test-wasms.git build/eos-vm-oracle-build/wasms
          git -C build/eos-vm-oracle-build/wasms checkout "$FIXTURE_COMMIT"

      - name: Apply audited donor buildability shim
        run: python3 tests/vm_wasm/prepare_donor_oracle.py --donor build/eos-vm-oracle

      - name: Verify original test bodies remain unchanged
        run: git -C build/eos-vm-oracle diff --exit-code -- tests

      - name: Configure donor Catch2 suite
        run: >-
          cmake -S build/eos-vm-oracle -B build/eos-vm-oracle-build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_INSTALL=OFF
          -DENABLE_TOOLS=OFF
          -DENABLE_TESTS=ON
          -DENABLE_SPEC_TESTS=ON

      - name: Build donor Catch2 suite
        run: cmake --build build/eos-vm-oracle-build --target unit_tests eos_vm_spec_tests -j 4

      - name: Run donor Catch2 suite
        shell: bash
        run: |
          build/eos-vm-oracle-build/tests/unit_tests
          build/eos-vm-oracle-build/tests/eos_vm_spec_tests
